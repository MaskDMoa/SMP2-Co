name: Modpack server smoke test

on:
  push:
    branches:
      - "update/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modpack-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-server:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the modpack
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Require Minecraft EULA acceptance
        env:
          MINECRAFT_EULA_ACCEPTED: ${{ vars.MINECRAFT_EULA_ACCEPTED }}
        run: |
          if [[ "$MINECRAFT_EULA_ACCEPTED" != "true" ]]; then
            echo "::error::Review https://aka.ms/MinecraftEULA and set the repository variable MINECRAFT_EULA_ACCEPTED to true to enable the server test."
            exit 1
          fi

      - name: Install NeoForge server
        shell: bash
        run: |
          set -euo pipefail
          server_dir="$RUNNER_TEMP/neoforge-server"
          mkdir -p "$server_dir"
          cd "$server_dir"
          curl --fail --location --silent --show-error \
            "https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.264/neoforge-21.1.264-installer.jar" \
            --output neoforge-installer.jar
          java -jar neoforge-installer.jar --installServer

      - name: Stage server mods
        shell: bash
        run: |
          set -euo pipefail
          server_dir="$RUNNER_TEMP/neoforge-server"
          mkdir -p "$server_dir/mods"
          declare -A excluded=()
          while IFS= read -r filename || [[ -n "$filename" ]]; do
            [[ -z "$filename" || "$filename" == \#* ]] && continue
            excluded["$filename"]=1
          done < .github/server-mod-exclusions.txt

          shopt -s nullglob
          for mod in mods/*.jar; do
            filename="${mod##*/}"
            if [[ -n "${excluded[$filename]:-}" ]]; then
              echo "Skipping client-only mod: $filename"
            else
              cp "$mod" "$server_dir/mods/"
            fi
          done

          printf 'eula=true\n' > "$server_dir/eula.txt"
          cat > "$server_dir/server.properties" <<'EOF'
          level-name=ci-world
          level-seed=20261019
          level-type=minecraft\:normal
          online-mode=false
          max-tick-time=120000
          view-distance=4
          simulation-distance=4
          EOF
          cat > "$server_dir/user_jvm_args.txt" <<'EOF'
          -Xms1G
          -Xmx5G
          -XX:+UseG1GC
          EOF

      - name: Start server and generate a world
        shell: bash
        run: |
          set -euo pipefail
          server_dir="$RUNNER_TEMP/neoforge-server"
          cd "$server_dir"
          mkfifo server.stdin
          bash run.sh --nogui < server.stdin > server.log 2>&1 &
          server_pid=$!
          exec 3>server.stdin

          ready=false
          for _ in $(seq 1 1200); do
            if grep -q "Done (" server.log; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              tail -n 200 server.log
              exit 1
            fi
            sleep 1
          done

          if [[ "$ready" != true ]]; then
            tail -n 200 server.log
            kill "$server_pid" 2>/dev/null || true
            exit 1
          fi

          if [[ ! -f ci-world/level.dat ]]; then
            echo "The server started but did not generate ci-world/level.dat."
            tail -n 200 server.log
            exit 1
          fi

          printf 'stop\n' >&3
          wait "$server_pid"

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modpack-server-logs
          path: |
            ${{ runner.temp }}/neoforge-server/server.log
            ${{ runner.temp }}/neoforge-server/crash-reports/
          if-no-files-found: ignore

  open-upstream-pull-request:
    needs: test-server
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check upstream and create or reuse pull request
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_PR_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          FORK_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::Add the UPSTREAM_PR_TOKEN secret to this fork. It must be allowed to open pull requests in JhonJRS/SMP2."
            exit 1
          fi

          git remote add upstream https://github.com/JhonJRS/SMP2.git
          git fetch --no-tags upstream main

          merge_base="$(git merge-base upstream/main HEAD)"
          if [[ -z "$merge_base" ]]; then
            echo "::error::The branch has no common history with JhonJRS/SMP2/main."
            exit 1
          fi

          if git diff --quiet upstream/main HEAD -- mods; then
            echo "No mod changes relative to the upstream base; no pull request is needed."
            exit 0
          fi

          if ! git merge-tree --write-tree upstream/main HEAD > "$RUNNER_TEMP/upstream-merge-check.txt"; then
            cat "$RUNNER_TEMP/upstream-merge-check.txt"
            echo "::error::The branch conflicts with the current JhonJRS/SMP2/main. Resolve the conflict before opening a pull request."
            exit 1
          fi

          head_ref="${FORK_OWNER}:${BRANCH}"
          existing_pr="$(gh pr list \
            --repo JhonJRS/SMP2 \
            --state open \
            --base main \
            --head "$head_ref" \
            --json url \
            --jq '.[0].url // ""')"

          if [[ -n "$existing_pr" ]]; then
            echo "An upstream pull request already exists: $existing_pr"
          else
            gh pr create \
              --repo JhonJRS/SMP2 \
              --base main \
              --head "$head_ref" \
              --title "Update modpack mods ($BRANCH)" \
              --body "Automated modpack update. The NeoForge 1.21.1 dedicated-server smoke test passed, and this branch was checked against the current upstream main."
          fi
